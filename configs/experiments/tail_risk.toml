[experiment]
id = "tail_risk"
script = "scripts/experiment_tail_risk.py"
notebook = "notebooks/03_tail_risk_classification.ipynb"
description = "Tail-event classification"

[execution]
quick_mode_default = true
random_state = 42

[dataset]
horizons = [1, 5, 10]
primary_alpha = 0.95
robustness_alpha = 0.975
features = [
    "market_loss_1d", "vix", "realized_volatility_20d",
    "drawdown_severity", "liquidity_stress_20d", "baa_credit_spread_pct",
    "term_spread_10y_2y_pct", "average_equity_correlation_60d",
    "negative_momentum_21d", "lagged_portfolio_loss_1d",
]

[walk_forward]
oos_start = "2020-01-01"
training_window_years = 5
selection_window_months = 18
calibration_window_months = 24
oos_block_years = 1

[calibration]
methods = ["sigmoid"]

[class_weight]
modes = ["balanced", "unweighted"]

[models]
main = [
    "Rolling prior probability", "Logistic", "Logistic oriented",
    "Penalized logistic", "Explicit interactions", "RBF SVM",
    "Random forest", "Gradient boosting", "Choquistic 1-additive",
    "Choquistic 2-additive", "Choquet linear classifier", "MLP",
    "Fuzzy Choquet neural network",
]
robustness = [
    "Rolling prior probability", "Logistic", "Logistic oriented",
    "Penalized logistic", "Gradient boosting", "Choquistic 1-additive",
    "Choquistic 2-additive", "Choquet linear classifier",
]
orientation = [
    "Logistic", "Logistic oriented", "Choquistic 1-additive",
    "Choquistic 2-additive", "Choquet linear classifier",
]
report = [
    "Rolling prior probability", "Logistic", "Logistic oriented",
    "Explicit interactions", "Gradient boosting", "Choquistic 1-additive",
    "Choquistic 2-additive", "Choquet linear classifier", "MLP",
    "Fuzzy Choquet neural network",
]

[analysis]
stability_horizon = 5
stability_cutoffs = ["2018-12-31", "2020-12-31", "2022-12-30", "2024-12-31", "2026-07-30"]
stability_purge = 5
top_interactions = 12

[aggregation]
model_name = "Choquistic model aggregator"
base_models = [
    "Rolling prior probability", "Logistic", "Logistic oriented",
    "Penalized logistic", "Explicit interactions", "RBF SVM",
    "Random forest", "Gradient boosting", "MLP",
]
robustness_base_models = [
    "Rolling prior probability", "Logistic", "Logistic oriented",
    "Penalized logistic", "Gradient boosting",
]

[parameter_grids."Penalized logistic"]
"classifier__C" = [0.01, 0.1, 1.0, 10.0]

[parameter_grids."Explicit interactions"]
"classifier__logistic__C" = [0.01, 0.1, 1.0]

[parameter_grids."RBF SVM"]
"classifier__C" = [0.1, 1.0, 10.0]
"classifier__gamma" = ["scale", 0.1]

[parameter_grids."Random forest"]
"classifier__max_depth" = [3, 6, "__none__"]
"classifier__min_samples_leaf" = [5, 20]

[parameter_grids."Gradient boosting"]
"classifier__learning_rate" = [0.03, 0.1]
"classifier__max_leaf_nodes" = [7, 15]
"classifier__l2_regularization" = [0.0, 1.0]

[parameter_grids."Fuzzy Choquet neural network"]
"classifier__hidden_layer_sizes" = [[32], [32, 16]]
"classifier__alpha" = [0.0001, 0.001]
"classifier__mlp_solver" = ["adam"]

[parameter_grids.MLP]
"classifier__hidden_layer_sizes" = [[8], [16], [32]]
"classifier__alpha" = [0.0001, 0.001, 0.01]
"classifier__solver" = ["adam", "lbfgs"]
"classifier__learning_rate_init" = [0.0003, 0.001]
