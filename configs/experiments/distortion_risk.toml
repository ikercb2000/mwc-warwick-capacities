[experiment]
id = "distortion_risk"
script = "scripts/experiment_distortion_risk.py"
notebook = "notebooks/04_distortion_risk.ipynb"
description = "Distortion-risk capital analysis with observed Bloomberg losses"

[execution]
quick_mode_default = false

[real_data]
assets = ["AAPL", "AMZN", "JPM", "KO", "MSFT", "NVDA", "UNH", "WMT", "XOM"]
correlation_assets = ["AAPL", "JPM", "XOM"]
diversification_assets = ["AAPL", "JPM"]
stress_vix_threshold = 30.0

[risk]
expected_shortfall_alpha = 0.975
capital_window = 252
proportional_hazards_gammas = [0.70, 1.20]

[axiom_test]
cash = 0.01
scale = 1.5
