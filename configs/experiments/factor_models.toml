[experiment]
id = "factor_models"
script = "scripts/experiment_factors.py"
notebook = "notebooks/01_choquet_factor_models.ipynb"
description = "Classical and Choquet financial factor models"

[execution]
quick_mode_default = true
random_state = 42

[dataset]
assets = ["AAPL", "AMZN", "JPM", "KO", "MSFT", "NVDA", "UNH", "WMT", "XOM"]
features = [
    "market_excess_return", "sector_excess_return", "size_spread",
    "value_growth_spread", "momentum_spread", "quality_spread",
    "low_volatility_spread",
]

[models]
main = [
    "OLS", "OLS oriented", "Monotone linear", "Ridge", "Lasso",
    "Elastic net", "Choquet 1-additive", "Choquet 1-additive scaled-q",
    "Choquet 2-additive", "Choquet 2-additive L1",
    "Choquet 2-additive scaled-q", "Choquet 2-additive scaled-q L1",
]
orientation = [
    "OLS", "OLS oriented", "Monotone linear",
    "Choquet 1-additive", "Choquet 1-additive scaled-q",
    "Choquet 2-additive", "Choquet 2-additive L1",
    "Choquet 2-additive scaled-q", "Choquet 2-additive scaled-q L1",
]
extreme_robustness = [
    "OLS", "Ridge", "Lasso", "Elastic net", "Monotone linear",
    "Choquet 1-additive", "Choquet 1-additive scaled-q",
    "Choquet 2-additive", "Choquet 2-additive L1",
    "Choquet 2-additive scaled-q", "Choquet 2-additive scaled-q L1",
]
residual_covariance = [
    "OLS", "Choquet 1-additive", "Choquet 1-additive scaled-q",
    "Choquet 2-additive", "Choquet 2-additive L1",
    "Choquet 2-additive scaled-q", "Choquet 2-additive scaled-q L1",
]
prediction = [
    "OLS", "Ridge", "Lasso", "Choquet 1-additive",
    "Choquet 1-additive scaled-q", "Choquet 2-additive",
    "Choquet 2-additive L1", "Choquet 2-additive scaled-q",
    "Choquet 2-additive scaled-q L1",
]

[analysis]
stability_asset = "AAPL"
stability_cutoffs = ["2018-12-31", "2020-12-31", "2022-12-30", "2024-12-31", "2026-07-30"]
prediction_assets = ["AAPL", "JPM", "XOM"]
representative_model = "Choquet 1-additive"
hac_max_lags = 10
stability_purge = 0

[validation_stress]
validation_start = "2018-01-01"
validation_end = "2021-12-31"
stress_start = "2020-01-01"
stress_end = "2021-12-31"

[parameter_grids.Ridge]
"regressor__alpha" = [0.01, 0.1, 1.0, 10.0]

[parameter_grids.Lasso]
"regressor__alpha" = [0.00001, 0.0001, 0.001, 0.01]

[parameter_grids."Elastic net"]
"regressor__alpha" = [0.00001, 0.0001, 0.001]
"regressor__l1_ratio" = [0.25, 0.5, 0.75]

[parameter_grids."Choquet 2-additive L1"]
"regressor__regressor__penalty" = [0.00001, 0.0001, 0.001, 0.01]

[parameter_grids."Choquet 2-additive scaled-q L1"]
"regressor__penalty" = [0.00001, 0.0001, 0.001, 0.01]
